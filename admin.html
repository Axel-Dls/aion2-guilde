<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: https:; connect-src https://cvsrncwbferhkwsfajzf.supabase.co; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Admin · Guilde</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&family=Figtree:wght@400;600;700;800&display=swap">
<link rel="stylesheet" href="assets/common.css">
<style>
/* Admin : connexion, état du suivi, ajout rapide, onglets Suivis / En attente, barre d'enregistrement collante */
.wrap{max-width:880px;margin:0 auto;padding-block:36px 140px}
.back{font-size:14px;font-weight:600;text-decoration:none}
.wrap > .card,.side > .card{margin-bottom:16px}
.side,.main{min-width:0}
.card p{margin:0 0 10px;max-width:68ch}
.card ol{margin:0 0 14px;padding-left:20px;max-width:68ch}
.card li{margin-bottom:4px}
code{font:13px var(--mono);background:var(--surface-2);border:1px solid var(--line);border-radius:4px;padding:1px 5px}
.msg{margin:10px 0 0;font-size:14px}
.msg.err{color:var(--down)} .msg.ok{color:var(--up)}

/* Accès */
.list.acc .item{grid-template-columns:minmax(0,1fr) minmax(0,150px) 130px auto}
.list.acc .item.req{background:var(--gold-soft)}
.acc-who{display:flex;gap:10px;align-items:center;min-width:0}
.acc-who img{width:30px;height:30px;border-radius:50%;flex:none}
.acc-h{padding:10px 16px;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:var(--surface-2);border-bottom:1px solid var(--line)}
.you{font-size:11px;font-weight:700;padding:1px 7px;border-radius:999px;margin-left:6px;background:var(--surface-2);color:var(--muted)}
@media (max-width:640px){.list.acc .item{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.list.acc .item .c1{grid-column:1/-1}.list.acc .item .acts{grid-column:1/-1;justify-content:flex-start}}
label.chk{display:inline-flex;gap:8px;align-items:center;font-size:14px;color:var(--muted);margin-top:10px}

/* État du suivi */
.health-h{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px}
.health-h .acts{display:flex;gap:6px;flex-wrap:wrap}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:14px 0 0}
.fact{min-width:0}
.fact .v{font-weight:700;margin-top:2px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.fact .s{font-size:13px;color:var(--muted)}
.dot{width:9px;height:9px;border-radius:50%;flex:none;background:var(--muted)}
.dot.ok{background:var(--up)} .dot.bad{background:var(--down)} .dot.run{background:var(--warn)}
.issues{list-style:none;margin:14px 0 0;padding:0;border-top:1px solid var(--line)}
.issues li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.issues li:last-child{border-bottom:0;padding-bottom:0}
.issues .who{font-weight:700}
.issues .det{grid-column:1;font-size:13px;color:var(--muted)}
.issues .acts{grid-row:1/span 2;grid-column:2;display:flex;gap:6px}
.issues .acts .btn,.issues .acts button{padding:5px 10px;font-size:13px}
button.link{all:unset;cursor:pointer;color:var(--gold);text-decoration:underline;text-underline-offset:2px}
button.link:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.ok-line{margin:14px 0 0;font-size:14px;color:var(--up);font-weight:600}
@media (max-width:640px){.facts{grid-template-columns:minmax(0,1fr)}}

/* Ajout */
.addrow{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr) minmax(0,.9fr) auto;gap:10px;margin-top:12px}
@media (max-width:640px){.addrow{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}#nName,.addrow button{grid-column:1/-1}}

/* Onglets + recherche */
.listhead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px;margin:26px 0 8px}
.listhead .r{display:flex;gap:10px;align-items:center}
kbd{font:12px var(--mono);border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px;color:var(--muted)}
.kbd-hint{font-size:12px;color:var(--muted)}
@media (max-width:899px){.kbd-hint{display:none}}
.tabs{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px}
.tabs button{border:0;background:none;color:var(--muted);padding:7px 14px;border-radius:7px}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgb(0 0 0 / .15)}
.tabs .n{min-width:22px;padding:0 6px;border-radius:999px;background:var(--line);color:var(--ink);font-size:12px;font-variant-numeric:tabular-nums;text-align:center}
.tabs button[aria-selected="true"] .n{background:var(--gold-soft);color:var(--gold)}
#q{width:240px;max-width:100%}
@media (max-width:640px){.tabs{display:flex;width:100%}.tabs button{flex:1;justify-content:center;padding:7px 6px;font-size:13px}.listhead .r,#q{width:100%}}
.hint{font-size:13px;color:var(--muted);margin:0 0 10px}

/* Liste */
.list{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.item{display:grid;align-items:center;gap:10px 14px;padding:10px 16px;border-bottom:1px solid var(--line);position:relative}
.item:last-child{border-bottom:0}
.item.changed::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:var(--gold-strong)}
.item.flash{animation:flash 1.6s ease-out}
@keyframes flash{from{background:var(--gold-soft)}to{background:transparent}}
.list.on .item{grid-template-columns:minmax(0,1fr) 80px 130px auto}
.list.off .item{grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) 130px auto}
.nm{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sub{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gs{text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
.gs small{display:block;font-weight:400;font-size:12px;color:var(--muted)}
.item select,.item input{padding:6px 9px;width:100%}
.item .acts{display:flex;gap:4px;justify-content:flex-end;align-items:center}
.tag-new{font-size:11px;font-weight:700;padding:1px 7px;border-radius:999px;margin-left:6px;background:var(--gold-soft);color:var(--gold)}
.ext{font-size:13px;font-weight:600;text-decoration:none;white-space:nowrap}
.item.alt{background:var(--surface-2);padding-left:40px}
.item.alt .nm{font-weight:600}
.item.alt::after{content:"↳";position:absolute;left:18px;top:50%;transform:translateY(-50%);color:var(--muted)}
.altcount{font-size:12px;font-weight:600;color:var(--muted);margin-left:6px}

/* Évaluations */
.ev-tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin:0 0 10px}
.ev-tools .l{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.legend{display:flex;gap:12px;font-size:12px;color:var(--muted);align-items:center;flex-wrap:wrap}
.legend span{display:inline-flex;gap:5px;align-items:center}
.ev{display:grid;grid-template-columns:minmax(0,1fr);gap:10px;padding:14px 16px;border-bottom:1px solid var(--line);position:relative}
.ev:last-child{border-bottom:0}
.ev.changed::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:3px;border-radius:0 3px 3px 0;background:var(--gold-strong)}
.ev.alerted{background:var(--down-soft)}
.ev-who{min-width:0}
.ev-who .nm{white-space:normal}
.ev-who .sub{white-space:normal;font-variant-numeric:tabular-nums}
.ev-who .sub b{color:var(--ink);font-weight:700}
.ev-who .up{color:var(--up);font-weight:700} .ev-who .down{color:var(--down);font-weight:700}
.auto{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.ev-head{display:none}
.auto .flag{margin-left:0}
.crit{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cr{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 4px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-size:11px;font-weight:600;color:var(--muted);text-align:center;min-width:0}
.cr:hover{border-color:var(--gold)}
.cr:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.cr span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.lvl{width:14px;height:14px;border-radius:50%;border:2px dashed var(--line)}
.lvl.ok{background:var(--up);border:0} .lvl.moyen{background:var(--warn);border:0} .lvl.ko{background:var(--down);border:0}
.ev-bot{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:center}
.alert-btn[aria-pressed="true"]{background:var(--down);border-color:var(--down);color:#fff}
.ev-bot input{width:100%}
@media (max-width:640px){.crit{grid-template-columns:repeat(4,minmax(0,1fr))}.ev-bot{grid-template-columns:minmax(0,1fr)}}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
@media (max-width:640px){
  .list.on .item{grid-template-columns:auto minmax(0,1fr) auto}
  .list.off .item{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .item .c1{grid-column:1/-1}
  .list.on .item .gs{text-align:left}
  .list.off .item .acts{grid-column:1/-1;justify-content:flex-start}
}

/* PC : état du suivi et ajout dans une colonne à gauche, listes à droite ; évaluations en tableau */
@media (min-width:1180px){
  :root{--wrap:1500px}
  .wrap{max-width:1500px;padding-inline:12px}
  #editor:not([hidden]){display:grid;grid-template-columns:310px minmax(0,1fr);gap:24px;align-items:start}
  .side{position:sticky;top:20px;max-height:calc(100vh - 40px);overflow:auto;scrollbar-width:thin}
  .side .facts{grid-template-columns:minmax(0,1fr);gap:12px}
  .side .health-h .acts,.side #rerun{width:100%;justify-content:center}
  .side .addrow{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .side #nName,.side .addrow button{grid-column:1/-1}
  .side .addrow button{justify-content:center}
  .listhead{margin-top:0}
  .list{overflow:visible}
  .ev,.ev-head{grid-template-columns:minmax(190px,.9fr) auto minmax(280px,1.4fr);gap:16px;align-items:center}
  .ev{padding:10px 16px}
  .ev-head{display:grid;position:sticky;top:0;z-index:2;padding:9px 16px;background:var(--surface-2);border-bottom:1px solid var(--line);border-radius:12px 12px 0 0;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
  .ev-head .crit span{text-align:center;letter-spacing:0;text-transform:none;font-size:11.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .crit{grid-template-columns:repeat(7,58px);gap:4px}
  .ev .cr{flex-direction:row;justify-content:center;height:34px;padding:0}
  .ev .cr span{display:none}
  .lvl{width:16px;height:16px}
  .ev-bot{grid-template-columns:auto minmax(0,1fr);gap:8px}
  .ev-bot .alert-btn{padding:7px 10px}
  .ev-bot input{padding:7px 10px}
  .list.on .item{grid-template-columns:minmax(0,1fr) 90px 200px auto;padding-block:8px}
}

/* Barre d'enregistrement */
.bar{position:fixed;left:0;right:0;bottom:0;padding:12px 20px calc(12px + env(safe-area-inset-bottom,0px));background:var(--surface);border-top:1px solid var(--line);box-shadow:0 -6px 24px rgb(0 0 0 / .18)}
.bar .in{max-width:var(--wrap,880px);margin:0 auto;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.bar .s{font-size:14px;color:var(--muted);min-width:0;flex:1 1 300px}
.bar .s strong{color:var(--ink)}
.bar .acts{display:flex;gap:8px}
</style>
</head>
<body>
<div class="wrap">
  <header class="page-head">
    <div>
      <p class="eyebrow" id="eyebrow">Administration</p>
      <h1>Gestion des membres</h1>
    </div>
    <a class="back" href="./">← Retour au classement</a>
  </header>

  <div id="editor" hidden>
    <aside class="side">
    <!-- État du suivi -->
    <section class="card" id="health" aria-label="État du suivi">
      <div class="health-h">
        <h2>État du suivi</h2>
        <span class="acts">
          <button type="button" id="rerun" title="Demande un nouveau relevé des GS et CP (lancé dans les 30 minutes environ)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg>
            Relancer la mise à jour</button>
        </span>
      </div>
      <div class="facts">
        <div class="fact"><div class="label">Dernier relevé</div><div class="v" id="hData">–</div><div class="s" id="hDataSub"></div></div>
        <div class="fact"><div class="label">Prochain relevé</div><div class="v" id="hRun">–</div><div class="s" id="hRunSub"></div></div>
        <div class="fact"><div class="label">Connecté</div><div class="v" id="who">–</div><div class="s"><a id="repoLink" target="_blank" rel="noopener" title="Journal des relevés automatiques sur GitHub">Journal</a> · <button type="button" class="link" id="logout" title="Se déconnecter de ce site sur cet appareil">Se déconnecter</button></div></div>
      </div>
      <div id="hIssues"></div>
      <p class="msg" id="runMsg" role="status" hidden></p>
    </section>

    <form class="card" id="addForm" autocomplete="off">
      <h2>Ajouter un perso</h2>
      <div class="addrow">
        <input id="nName" placeholder="Pseudo exact (accents compris)" aria-label="Pseudo" required>
        <input id="nServer" list="servers" aria-label="Serveur" required>
        <select id="nRole" aria-label="Statut ou alt de"></select>
        <button class="primary" type="submit">Ajouter</button>
      </div>
    </form>
    </aside>

    <main class="main">

    <div class="listhead">
      <div class="tabs" role="tablist" aria-label="Listes">
        <button type="button" role="tab" id="tabOn" aria-selected="true">Suivis <span class="n" id="cntOn">0</span></button>
        <button type="button" role="tab" id="tabOff" aria-selected="false">En attente <span class="n" id="cntOff">0</span></button>
        <button type="button" role="tab" id="tabEv" aria-selected="false">Évaluations <span class="n" id="cntEv">0</span></button>
        <button type="button" role="tab" id="tabAcc" aria-selected="false" hidden>Accès <span class="n" id="cntAcc">0</span></button>
      </div>
      <span class="r"><span class="kbd-hint"><kbd>/</kbd></span>
      <input type="search" id="q" placeholder="Rechercher un pseudo…" aria-label="Rechercher un pseudo" aria-keyshortcuts="/"></span>
    </div>
    <p class="hint" id="hint"></p>
    <div class="ev-tools" id="evTools" hidden>
      <span class="l">
        <label class="chk" style="margin:0"><input type="checkbox" id="onlyAlerts"> Seulement les alertes et signaux</label>
        <span class="legend" aria-hidden="true"><span><i class="lvl ok"></i>Bien</span><span><i class="lvl moyen"></i>Moyen</span><span><i class="lvl ko"></i>À surveiller</span><span><i class="lvl"></i>Non noté</span></span>
      </span>
      <span class="l">
        <input type="file" id="xlsx" accept=".xlsx,.xls" hidden>
        <button type="button" id="importBtn" title="Reprendre les évaluations de l'onglet « Suivi Global membres » du tableau Excel">Importer le tableau Excel</button>
      </span>
    </div>
    <div class="list on" id="list"></div>
    </main>
  </div>
</div>

<datalist id="servers"></datalist>

<div class="bar" id="bar" hidden>
  <div class="in">
    <span class="s" id="barText"></span>
    <span class="acts">
      <button type="button" id="discard">Tout annuler</button>
      <button type="button" class="primary" id="save">Enregistrer</button>
    </span>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js" integrity="sha384-Rj26LVGvoeRVR6+mwQmFfcR3QOBEwT+ZmuCWpuiqeTzJpCs0ER4ITAWGb4Hiy3Ok" crossorigin="anonymous"></script>
<script src="assets/common.js"></script>
<script>
const { $, esc, fmt, norm, RANKS, ISSUE, SERVER_ID, REPO, profileUrl, ago, dateTime, loadDb, flags, toast, logout, sb, ok, auth, ROLE_LABEL } = G;
const ICON = {
  pause: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M9 6v12M15 6v12"/></svg>',
  play: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 5l12 7-12 7z"/></svg>',
  trash: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>',
  undo: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 14L4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/></svg>',
};

$("repoLink").href = `${REPO.url}/actions/workflows/update.yml`;
$("servers").innerHTML = Object.keys(SERVER_ID).sort().map(s => `<option value="${s}">`).join("");
// Critères d'évaluation (colonnes de l'onglet « Suivi Global membres » du tableau Excel)
const CRITERIA = [["progression", "Progression", "Progrès"], ["activite", "Activités", "Activités"], ["presence", "Présence raids", "Présence"],
  ["ponctualite", "Ponctualité", "Ponct."], ["implication", "Implication", "Implic."], ["comportement", "Comportement", "Comport."],
  ["fiabilite", "Fiabilité", "Fiabilité"]];
const LEVELS = ["", "ok", "moyen", "ko"];
const LEVEL_LABEL = { "": "non noté", ok: "bien", moyen: "moyen", ko: "à surveiller" };
const REFRESH_HOURS = 11;   // relevé automatique si le dernier est plus ancien (scripts/update.py)

let ME = null, ROWS = [], REMOVED = [], LIVE = {}, DB = null;
let EVALS = { by: {} }, EVALS_O = "{}", ALIASES = {};
let ACCESS = [], REQUESTS = [];
let DEFAULT_SERVER = "Triniel", TAB = "on", CONFIRM = null;

// ---------------------------------------------------------------- modifications en cours
const isChanged = r => r.isNew || ["name", "server", "role", "main", "on"].some(k => (r[k] || "") !== (r.o[k] || ""));
// Mains suivis (pour le menu « Alt de ») et liste triée main → ses alts
const mainsOf = rows => rows.filter(r => r.on && !r.main);
function grouped(rows, sortMains = (a, b) => 0) {
  const names = new Set(rows.filter(r => !r.main).map(r => norm(r.name)));
  const mains = rows.filter(r => !r.main || !names.has(norm(r.main))).sort(sortMains);
  return mains.flatMap(m => [m, ...rows.filter(r => r.main && norm(r.main) === norm(m.name) && r !== m)]);
}
// Menu unique « Statut / Alt de »
function roleSelect(r, attrs) {
  const value = r.main ? "alt:" + r.main : r.role;
  const mains = mainsOf(ROWS).filter(m => m !== r).map(m => m.name).sort((a, b) => a.localeCompare(b, "fr"));
  if (r.main && !mains.some(n => norm(n) === norm(r.main))) mains.unshift(r.main);
  return `<select ${attrs}>${RANKS.map(x => `<option${x === value ? " selected" : ""}>${x}</option>`).join("")}
    <optgroup label="Alt de…">${mains.map(n => `<option value="alt:${esc(n)}"${"alt:" + n === value ? " selected" : ""}>Alt de ${esc(n)}</option>`).join("")}</optgroup></select>`;
}
function applyRole(r, v) {
  if (v.startsWith("alt:")) { r.main = v.slice(4); r.role = "Membre"; }
  else { r.main = ""; r.role = v; }
}
function changeList() {
  const out = [];
  for (const r of ROWS) {
    if (r.isNew) { out.push(`ajout de ${r.name}`); continue; }
    if (r.name !== r.o.name || r.server !== r.o.server) out.push(`${r.o.name} → ${r.name}${r.server !== r.o.server ? ` (${r.server})` : ""}`);
    if (r.role !== r.o.role) out.push(`${r.name} : ${r.role}`);
    if ((r.main || "") !== (r.o.main || "")) out.push(r.main ? `${r.name} alt de ${r.main}` : `${r.name} devient un main`);
    if (r.on !== r.o.on) out.push(`${r.name} ${r.on ? "réactivé" : "mis en attente"}`);
  }
  REMOVED.forEach(r => out.push(`suppression de ${r.name}`));
  return out;
}
function evalChanges() {
  const before = JSON.parse(EVALS_O).by || {};
  return Object.keys({ ...before, ...EVALS.by }).filter(k => JSON.stringify(before[k] || null) !== JSON.stringify(EVALS.by[k] || null));
}

// ---------------------------------------------------------------- état du suivi
async function renderHealth() {
  if (DB?.updatedAt) {
    const late = (Date.now() - new Date(DB.updatedAt)) / 36e5 > 36;
    $("hData").innerHTML = `<span class="dot ${late ? "bad" : "ok"}"></span>${esc(ago(DB.updatedAt))}`;
    $("hDataSub").textContent = `${dateTime(DB.updatedAt)} · ${DB.counts?.ok ?? "?"}/${DB.counts?.total ?? "?"} persos lus`;
  } else {
    $("hData").textContent = "Aucun"; $("hDataSub").textContent = "";
  }

  const issues = DB?.run?.issues || [];
  const shown = HEALTH_ALL ? issues : issues.slice(0, 5);
  $("hIssues").innerHTML = issues.length
    ? `<ul class="issues">${shown.map(i => {
        const row = ROWS.find(r => norm(r.name) === norm(i.name) && r.on);
        const fixable = ["not_found", "unknown_server", "left_guild"].includes(i.type) && row;
        return `<li><span><span class="who">${esc(i.name)}</span>${flags([i])}</span>
          <span class="det">${esc(i.detail)}</span>
          <span class="acts"><a class="btn" href="${esc(profileUrl(LIVE[norm(i.name)] || { name: i.name, server: row?.server || DEFAULT_SERVER }))}" target="_blank" rel="noopener">Vérifier ↗</a>
          ${fixable ? `<button type="button" data-pause="${esc(i.name)}" title="Arrêter de suivre ce perso pour corriger son pseudo ou son serveur">${ICON.pause} En attente</button>` : ""}</span></li>`;
      }).join("")}</ul>${issues.length > 5 ? `<button type="button" class="quiet" id="hMore">${HEALTH_ALL ? "Réduire" : `Voir les ${issues.length - 5} autres signalements`}</button>` : ""}`
    : `<p class="ok-line">Aucun signalement au dernier relevé.</p>`;

  // Prochain relevé : en cours, demandé (traité dans les 30 min environ) ou automatique
  try {
    const [[run], [ask]] = await Promise.all([
      sb.from("passages").select("debut,fin").order("debut", { ascending: false }).limit(1).then(ok),
      sb.from("demandes_maj").select("demande_le,par").order("demande_le", { ascending: false }).limit(1).then(ok),
    ]);
    const running = run && !run.fin && Date.now() - new Date(run.debut) < 20 * 6e4;
    if (running) {
      $("hRun").innerHTML = `<span class="dot run"></span>En cours`;
      $("hRunSub").textContent = `commencé ${ago(run.debut)}`;
    } else if (ask && (!run || new Date(ask.demande_le) > new Date(run.debut))) {
      $("hRun").innerHTML = `<span class="dot run"></span>Demandé ${esc(ago(ask.demande_le))}`;
      $("hRunSub").textContent = `par ${ask.par || "?"} · lancé dans les 30 min environ`;
    } else {
      const next = run ? new Date(new Date(run.debut).getTime() + REFRESH_HOURS * 36e5) : null;
      $("hRun").innerHTML = `<span class="dot ok"></span>Automatique`;
      $("hRunSub").textContent = next && next > Date.now() ? `vers ${dateTime(next.toISOString())}` : "dans les 30 min environ";
    }
  } catch {
    $("hRun").textContent = "Inconnu"; $("hRunSub").textContent = "";
  }
}
let HEALTH_ALL = false;
$("hIssues").addEventListener("click", e => {
  if (e.target.closest("#hMore")) { HEALTH_ALL = !HEALTH_ALL; renderHealth(); return; }
  const b = e.target.closest("button[data-pause]"); if (!b) return;
  const r = ROWS.find(x => norm(x.name) === norm(b.dataset.pause) && x.on); if (!r) return;
  r.on = false; TAB = "off"; render(r);
  toast(`${r.name} mis en attente : corrige son pseudo ou son serveur, puis enregistre`);
});

// ---------------------------------------------------------------- liste
function itemOn(r, i) {
  const live = LIVE[norm(r.name)];
  const nAlts = !r.main ? ROWS.filter(x => x.on && norm(x.main) === norm(r.name)).length : 0;
  const sub = r.isNew ? "Vérifié au prochain relevé" : [live?.classFr, live?.level ? "niv. " + live.level : "", r.server].filter(Boolean).map(esc).join(" · ");
  return `<div class="item ${r.main ? "alt" : ""} ${isChanged(r) ? "changed" : ""}" data-i="${i}">
    <div class="c1"><div class="nm">${esc(r.name)}${nAlts ? `<span class="altcount">${nAlts} alt${nAlts > 1 ? "s" : ""}</span>` : ""}${r.isNew ? '<span class="tag-new">Nouveau</span>' : ""}${live ? flags(live.issues) : ""}</div><div class="sub">${sub}</div></div>
    <div class="gs">${fmt(live?.itemLevel)}<small>GS</small></div>
    ${roleSelect(r, `data-f="role" aria-label="Statut de ${esc(r.name)}"`)}
    <div class="acts">
      ${isChanged(r) && !r.isNew ? `<button type="button" class="icon" data-act="reset" title="Annuler les changements de ${esc(r.name)}" aria-label="Annuler les changements de ${esc(r.name)}">${ICON.undo}</button>` : ""}
      <button type="button" data-act="toggle" title="Ne plus suivre ce perso (son historique est conservé)">${ICON.pause} En attente</button>
    </div>
  </div>`;
}
function itemOff(r, i) {
  const confirming = CONFIRM === r;
  return `<div class="item ${isChanged(r) ? "changed" : ""}" data-i="${i}">
    <div class="c1"><input data-f="name" value="${esc(r.name)}" aria-label="Pseudo" placeholder="Pseudo exact"></div>
    <input data-f="server" list="servers" value="${esc(r.server)}" aria-label="Serveur de ${esc(r.name)}">
    ${roleSelect(r, `data-f="role" aria-label="Statut de ${esc(r.name)}"`)}
    <div class="acts">
      <a class="ext" href="${esc(profileUrl({ name: r.name, server: r.server }))}" target="_blank" rel="noopener" title="Chercher ce pseudo sur le site officiel">Vérifier ↗</a>
      ${confirming
        ? `<button type="button" class="danger" data-act="delok">Supprimer ?</button><button type="button" class="quiet" data-act="delno">Non</button>`
        : `<button type="button" data-act="toggle" title="Suivre à nouveau ce perso">${ICON.play} Réactiver</button>
           <button type="button" class="icon" data-act="del" title="Supprimer définitivement de la liste" aria-label="Supprimer ${esc(r.name)}">${ICON.trash}</button>`}
    </div>
  </div>`;
}
function render(focusRow) {
  const q = norm($("q").value);
  const on = ROWS.filter(r => r.on), off = ROWS.filter(r => !r.on);
  $("cntOn").textContent = on.length; $("cntOff").textContent = off.length;
  $("cntEv").textContent = mainsOf(ROWS).length;
  $("cntAcc").textContent = ACCESS.length + (REQUESTS.length ? ` +${REQUESTS.length}` : "");
  ["on", "off", "ev", "acc"].forEach(t => $("tab" + t[0].toUpperCase() + t.slice(1)).setAttribute("aria-selected", TAB === t));
  $("evTools").hidden = TAB !== "ev";
  if (TAB === "ev") { renderEvals(q); updateBar(); return; }
  if (TAB === "acc") { renderAccess(q); updateBar(); return; }

  const gs = r => LIVE[norm(r.name)]?.itemLevel || 0;
  let items;
  if (TAB === "on") {
    items = q ? on.filter(r => norm(r.name).includes(q) || norm(r.main).includes(q))
      : grouped(on, (a, b) => (!!b.isNew - !!a.isNew) || (RANKS.indexOf(a.role) - RANKS.indexOf(b.role)) || (gs(b) - gs(a)));
  } else {
    items = off.filter(r => !q || norm(r.name).includes(q)).sort((a, b) => a.name.localeCompare(b.name, "fr"));
  }
  items = items.map(r => [r, ROWS.indexOf(r)]);

  $("list").className = "list " + TAB;
  $("hint").textContent = TAB === "on"
    ? "Les persos suivis apparaissent dans le classement, chaque main suivi de ses alts. Le menu de droite donne le statut, ou fait d'un perso l'alt d'un autre. « En attente » arrête le suivi sans perdre l'historique."
    : "Persos non suivis : introuvables, à vérifier ou partis. Corrige le pseudo ou le serveur si besoin (« Vérifier » ouvre la recherche officielle), puis « Réactiver ».";
  $("list").innerHTML = items.length
    ? items.map(([r, i]) => TAB === "on" ? itemOn(r, i) : itemOff(r, i)).join("")
    : `<div class="empty">${q ? `Aucun pseudo ne contient « ${esc($("q").value)} ».` : TAB === "on" ? "Aucun perso suivi." : "Personne en attente."}</div>`;

  if (focusRow) {
    const el = $("list").querySelector(`.item[data-i="${ROWS.indexOf(focusRow)}"]`);
    if (el) { el.classList.add("flash"); el.scrollIntoView({ block: "nearest" }); }
  }
  updateBar();
}
function updateBar() {
  const ev = evalChanges();
  const ch = [...changeList(), ...(ev.length ? [`évaluations de ${ev.length} joueur${ev.length > 1 ? "s" : ""}`] : [])];
  $("bar").hidden = !ch.length;
  if (!ch.length) return;
  const shown = ch.slice(0, 3).map(esc).join(" · ") + (ch.length > 3 ? ` · +${ch.length - 3}` : "");
  $("barText").innerHTML = `<strong>${ch.length} modification${ch.length > 1 ? "s" : ""}</strong> à enregistrer : ${shown}`;
}

$("list").addEventListener("input", e => {
  if (TAB === "acc") return;
  const it = e.target.closest(".item"), f = e.target.dataset.f; if (!it || !f) return;
  const r = ROWS[+it.dataset.i];
  if (f === "name" || f === "server") { r[f] = e.target.value; it.classList.toggle("changed", isChanged(r)); updateBar(); }
});
$("list").addEventListener("change", e => {
  if (TAB === "acc") return;
  const it = e.target.closest(".item"), f = e.target.dataset.f; if (!it || !f) return;
  const r = ROWS[+it.dataset.i];
  if (f === "role") applyRole(r, e.target.value); else r[f] = e.target.value.trim();
  render();
});
$("list").addEventListener("click", e => {
  const b = e.target.closest("button[data-act]"); if (!b || TAB === "acc") return;
  const r = ROWS[+b.closest(".item").dataset.i];
  switch (b.dataset.act) {
    case "toggle": r.on = !r.on; CONFIRM = null; render(); toast(r.on ? `${r.name} réactivé` : `${r.name} mis en attente`); break;
    case "reset": Object.assign(r, r.o); render(); break;
    case "del": CONFIRM = r; render(); break;
    case "delno": CONFIRM = null; render(); break;
    case "delok":
      if (!r.isNew) REMOVED.push(r.o);
      ROWS.splice(ROWS.indexOf(r), 1); CONFIRM = null; render(); toast(`${r.name} supprimé`); break;
  }
});
$("tabOn").addEventListener("click", () => { TAB = "on"; CONFIRM = null; render(); });
$("tabOff").addEventListener("click", () => { TAB = "off"; CONFIRM = null; render(); });
$("tabEv").addEventListener("click", () => { TAB = "ev"; CONFIRM = null; render(); });
$("tabAcc").addEventListener("click", () => { TAB = "acc"; CONFIRM = null; render(); });
$("q").addEventListener("input", () => render());
// « / » pour chercher, Échap pour effacer
document.addEventListener("keydown", e => {
  if (e.key === "/" && !$("editor").hidden && !/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement?.tagName)) { e.preventDefault(); $("q").focus(); $("q").select(); }
  else if (e.key === "Escape" && document.activeElement === $("q") && $("q").value) { $("q").value = ""; render(); }
});

$("addForm").addEventListener("submit", e => {
  e.preventDefault();
  const name = $("nName").value.trim(), server = $("nServer").value.trim() || DEFAULT_SERVER;
  if (!name) return;
  const dup = ROWS.find(r => norm(r.name) === norm(name) && norm(r.server) === norm(server));
  if (dup) { TAB = dup.on ? "on" : "off"; render(dup); toast(`${dup.name} est déjà dans la liste${dup.on ? "" : " (en attente)"}`); return; }
  const row = { name, server, role: "Membre", main: "", on: true, isNew: true, o: {} };
  applyRole(row, $("nRole").value);
  ROWS.push(row);
  $("nName").value = ""; $("nName").focus();
  TAB = "on"; render(row); toast(`${name} ajouté : pense à enregistrer`);
});
$("discard").addEventListener("click", () => reloadAll().then(() => toast("Changements annulés")));

// ---------------------------------------------------------------- évaluations
// Une fiche par joueur (perso principal) : 7 critères, alerte, commentaire.
// Table evaluations : lisible et modifiable par les gérants et l'admin seulement.
const evalOf = name => EVALS.by[norm(name)];
function ensureEval(name) {
  return EVALS.by[norm(name)] ||= { name, crit: {}, alerte: false, comment: "" };
}
function autoSignals(live, avg) {
  const out = [];
  if (!live) return out;
  if (live.d7 != null && live.d7 <= 0 && (live.history || []).length >= 5) out.push({ type: "gs_flat", label: "GS stagne", detail: `GS ${live.d7 === 0 ? "identique" : "en baisse"} sur 7 jours` });
  if (live.itemLevel && avg && live.itemLevel < avg * 0.9) out.push({ type: "gs_low", label: "Sous la moyenne", detail: `GS ${fmt(live.itemLevel)} pour une moyenne de ${fmt(Math.round(avg))}` });
  return out;
}
function renderEvals(q) {
  const mains = mainsOf(ROWS);
  const lives = mains.map(r => LIVE[norm(r.name)]).filter(l => l?.itemLevel);
  const avg = lives.length ? lives.reduce((t, l) => t + l.itemLevel, 0) / lives.length : 0;
  const only = $("onlyAlerts").checked;
  const before = JSON.parse(EVALS_O).by || {};
  $("list").className = "list evs";
  $("hint").textContent = "Une fiche par joueur. Clique sur un critère pour le noter (bien → moyen → à surveiller → non noté). Ces évaluations ne sont visibles que par les gérants et l'admin.";
  const rows = mains
    .map(r => { const live = LIVE[norm(r.name)]; const ev = evalOf(r.name); const sig = [...autoSignals(live, avg), ...(live?.issues || [])]; return { r, live, ev, sig }; })
    .filter(x => !q || norm(x.r.name).includes(q))
    .filter(x => !only || x.ev?.alerte || x.sig.length || Object.values(x.ev?.crit || {}).includes("ko"))
    .sort((a, b) => (b.ev?.alerte ? 1 : 0) - (a.ev?.alerte ? 1 : 0) || a.r.name.localeCompare(b.r.name, "fr"));
  const head = `<div class="ev-head" aria-hidden="true"><span>Joueur</span><div class="crit">${CRITERIA.map(([, label, short]) => `<span title="${esc(label)}">${esc(short)}</span>`).join("")}</div><span>Alerte et commentaire</span></div>`;
  const sign = d => d == null ? "" : ` <span class="${d > 0 ? "up" : d < 0 ? "down" : ""}">${d > 0 ? "+" : d < 0 ? "−" : "±"}${fmt(Math.abs(d))}</span>`;
  $("list").innerHTML = rows.length ? head + rows.map(({ r, live, ev, sig }) => {
    const changed = JSON.stringify(before[norm(r.name)] || null) !== JSON.stringify(ev || null);
    const alts = ROWS.filter(x => x.on && norm(x.main) === norm(r.name)).length;
    return `<div class="ev ${ev?.alerte ? "alerted" : ""} ${changed ? "changed" : ""}" data-name="${esc(r.name)}">
      <div class="ev-who">
        <div class="nm">${esc(r.name)}${G.roleBadge(r.role)}${alts ? `<span class="altcount">${alts} alt${alts > 1 ? "s" : ""}</span>` : ""}</div>
        <div class="sub" title="${live ? `CP ${fmt(live.cp)}${live.cp7 != null ? ` (${live.cp7 >= 0 ? "+" : ""}${fmt(live.cp7)} en 7 j)` : ""}` : ""}">${live ? `${esc(live.classFr || "?")} · GS <b>${fmt(live.itemLevel)}</b>${sign(live.d7)}` : "Pas encore relevé"}</div>
        ${sig.length ? `<div class="auto">${sig.map(x => `<span class="flag ${ISSUE[x.type]?.bad ? "bad" : ""}" title="${esc(x.detail)}">${esc(x.label || ISSUE[x.type]?.label || x.type)}</span>`).join("")}</div>` : ""}
      </div>
      <div class="crit">${CRITERIA.map(([k, label, short]) => { const v = ev?.crit?.[k] || ""; return `<button type="button" class="cr" data-crit="${k}" title="${esc(label)} : ${LEVEL_LABEL[v]}" aria-label="${esc(label)} : ${LEVEL_LABEL[v]}"><i class="lvl ${v}"></i><span>${esc(short)}</span></button>`; }).join("")}</div>
      <div class="ev-bot">
        <button type="button" class="alert-btn" data-alert aria-pressed="${!!ev?.alerte}" title="Marquer ce joueur comme à surveiller">⚑ Alerte</button>
        <input data-comment value="${esc(ev?.comment || "")}" placeholder="Commentaire…" aria-label="Commentaire sur ${esc(r.name)}">
      </div>
    </div>`;
  }).join("") : `<div class="empty">${only ? "Aucune alerte ni signal." : "Aucun joueur."}</div>`;
}
$("list").addEventListener("click", e => {
  const card = e.target.closest(".ev"); if (!card) return;
  const name = card.dataset.name;
  const c = e.target.closest("button[data-crit]");
  if (c) {
    const ev = ensureEval(name), k = c.dataset.crit;
    ev.crit[k] = LEVELS[(LEVELS.indexOf(ev.crit[k] || "") + 1) % LEVELS.length];
    if (!ev.crit[k]) delete ev.crit[k];
    render(); return;
  }
  if (e.target.closest("button[data-alert]")) { const ev = ensureEval(name); ev.alerte = !ev.alerte; render(); }
});
$("list").addEventListener("input", e => {
  if (!e.target.matches("input[data-comment]")) return;
  const card = e.target.closest(".ev"), ev = ensureEval(card.dataset.name);
  ev.comment = e.target.value;
  card.classList.toggle("changed", JSON.stringify((JSON.parse(EVALS_O).by || {})[norm(card.dataset.name)] || null) !== JSON.stringify(ev));
  updateBar();
});
$("onlyAlerts").addEventListener("change", () => render());

// Import du tableau Excel (onglet « Suivi Global membres »), lu dans le navigateur uniquement
$("importBtn").addEventListener("click", () => $("xlsx").click());
$("xlsx").addEventListener("change", async e => {
  const file = e.target.files[0]; e.target.value = "";
  if (!file) return;
  try {
    if (!window.XLSX) await new Promise((ok, ko) => {
      const sc = document.createElement("script");
      sc.src = "https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";
      sc.integrity = "sha384-vtjasyidUo0kW94K5MXDXntzOJpQgBKXmE7e2Ga4LG0skTTLeBi97eFAXsqewJjw";
      sc.crossOrigin = "anonymous";
      sc.onload = ok; sc.onerror = () => ko(new Error("lecteur Excel indisponible"));
      document.head.append(sc);
    });
    const wb = XLSX.read(await file.arrayBuffer(), { type: "array" });
    const sheetName = wb.SheetNames.find(n => /suivi global/i.test(n))
      || wb.SheetNames.find(n => XLSX.utils.sheet_to_json(wb.Sheets[n], { header: 1 })[0]?.some(h => /comportement/i.test(h)));
    if (!sheetName) throw new Error("onglet « Suivi Global membres » introuvable");
    const rows = XLSX.utils.sheet_to_json(wb.Sheets[sheetName], { defval: "" });
    const col = (row, re) => { const k = Object.keys(row).find(h => re.test(h)); return k ? row[k] : ""; };
    const lvl = v => /🟢/.test(v) ? "ok" : /🟡/.test(v) ? "moyen" : /🔴/.test(v) ? "ko" : "";
    // Pseudo du tableau → perso suivi (même nom, ou ancien nom déclaré dans config.json)
    const mains = mainsOf(ROWS);
    const target = name => mains.find(m => norm(m.name) === norm(name)
      || (ALIASES[norm(m.name)] || []).some(a => norm(a) === norm(name)));
    const done = [], unknown = [];
    for (const row of rows) {
      const who = String(col(row, /^joueur|^nom|pseudo/i)).trim();
      if (!who) continue;
      const m = target(who);
      if (!m) { unknown.push(who); continue; }
      const ev = ensureEval(m.name);
      CRITERIA.forEach(([k, label]) => {
        const v = lvl(String(col(row, new RegExp("^" + label.split(" ")[0], "i"))));
        if (v) ev.crit[k] = v;
      });
      const al = col(row, /^alerte/i);
      if (al === true || /^(true|vrai|oui|x)$/i.test(String(al))) ev.alerte = true;
      const cm = String(col(row, /^comment/i)).trim();
      if (cm && !ev.comment) ev.comment = cm;
      done.push(m.name);
    }
    TAB = "ev"; render();
    toast(`${done.length} fiches importées${unknown.length ? ` · non reconnus : ${unknown.join(", ")}` : ""} — pense à enregistrer`);
  } catch (err) {
    toast("Import impossible : " + err.message);
  }
});

async function loadEvals() {
  EVALS = { by: {} };
  const rows = await sb.from("evaluations").select("*").then(ok);
  rows.forEach(r => { EVALS.by[r.pseudo_norm] = { name: r.pseudo, crit: r.crit || {}, alerte: r.alerte, comment: r.commentaire || "" }; });
  EVALS_O = JSON.stringify(EVALS);
}
async function saveEvals() {
  const before = JSON.parse(EVALS_O).by || {};
  for (const k of evalChanges()) {
    const ev = EVALS.by[k];
    const empty = !ev || (!Object.keys(ev.crit || {}).length && !ev.alerte && !ev.comment?.trim());
    if (empty) {
      delete EVALS.by[k];
      if (before[k]) await sb.from("evaluations").delete().eq("pseudo_norm", k).then(ok);
    } else {
      await sb.from("evaluations").upsert({ pseudo_norm: k, pseudo: ev.name, crit: ev.crit || {}, alerte: !!ev.alerte,
        commentaire: ev.comment || "", maj_le: new Date().toISOString(), maj_par: ME.nom || ME.discord_id }).then(ok);
    }
  }
  EVALS_O = JSON.stringify(EVALS);
}

// ---------------------------------------------------------------- accès (admin)
async function loadAccess() {
  if (ME.role !== "admin") return;
  [ACCESS, REQUESTS] = await Promise.all([
    sb.from("acces").select("*").order("pseudo").then(ok),
    sb.from("demandes_acces").select("*").order("demande_le", { ascending: false }).then(ok),
  ]);
}
const roleOptions = (sel, attrs) => `<select ${attrs}>${["lecteur", "gerant", "admin"].map(r => `<option value="${r}"${r === sel ? " selected" : ""}>${ROLE_LABEL[r]}</option>`).join("")}</select>`;
function renderAccess(q) {
  $("list").className = "list acc";
  $("hint").textContent = "Qui peut ouvrir le site. Lecteur : le classement. Gérant : le classement, la gestion des membres et les évaluations. Admin : tout, plus cette liste. Les changements ici sont enregistrés tout de suite.";
  const match = x => !q || norm(x).includes(q);
  const reqs = REQUESTS.filter(d => match(d.nom_discord) || match(d.discord_id));
  const acc = ACCESS.filter(a => match(a.pseudo) || match(a.discord_id));
  const avatar = url => url ? `<img src="${esc(url)}" alt="" referrerpolicy="no-referrer" loading="lazy" onerror="this.remove()">` : "";
  $("list").innerHTML = (reqs.length ? `<div class="acc-h">Demandes en attente · ${reqs.length}</div>` + reqs.map(d => `
    <div class="item req" data-req="${esc(d.discord_id)}">
      <div class="c1 acc-who">${avatar(d.avatar)}<div><div class="nm">${esc(d.nom_discord || "Compte Discord")}</div><div class="sub">ID ${esc(d.discord_id)} · ${esc(ago(d.demande_le))}</div></div></div>
      <input data-f="pseudo" value="${esc(d.nom_discord || "")}" placeholder="Pseudo en jeu" aria-label="Pseudo affiché">
      ${roleOptions("lecteur", `data-f="role" aria-label="Rôle"`)}
      <div class="acts"><button type="button" class="primary" data-act="accept">Accepter</button>
        <button type="button" class="icon" data-act="refuse" title="Refuser la demande" aria-label="Refuser la demande">${ICON.trash}</button></div>
    </div>`).join("") : "")
    + `<div class="acc-h">Accès · ${acc.length}</div>` + (acc.length ? acc.map(a => {
      const self = a.discord_id === ME.discord_id;
      return `<div class="item" data-acc="${esc(a.discord_id)}">
        <div class="c1"><div class="nm">${esc(a.pseudo)}${self ? '<span class="you">toi</span>' : ""}</div><div class="sub">ID ${esc(a.discord_id)} · depuis le ${esc(new Date(a.ajoute_le).toLocaleDateString("fr-FR"))}</div></div>
        <span></span>
        ${self ? `<span class="sub">${ROLE_LABEL[a.role]}</span>` : roleOptions(a.role, `data-f="role" aria-label="Rôle de ${esc(a.pseudo)}"`)}
        <div class="acts">${self ? "" : `<button type="button" class="icon" data-act="revoke" title="Retirer l'accès" aria-label="Retirer l'accès de ${esc(a.pseudo)}">${ICON.trash}</button>`}</div>
      </div>`;
    }).join("") : `<div class="empty">Personne.</div>`);
}
$("list").addEventListener("click", async e => {
  const b = e.target.closest("button[data-act]"); if (!b || TAB !== "acc") return;
  const it = b.closest(".item");
  b.disabled = true;
  try {
    if (b.dataset.act === "accept") {
      const id = it.dataset.req, pseudo = it.querySelector('[data-f="pseudo"]').value.trim();
      if (!pseudo) { toast("Indique un pseudo"); return; }
      await sb.from("acces").insert({ discord_id: id, pseudo, role: it.querySelector('[data-f="role"]').value }).then(ok);
      await sb.from("demandes_acces").delete().eq("discord_id", id).then(ok);
      toast(`${pseudo} a maintenant accès au site`);
    } else if (b.dataset.act === "refuse") {
      await sb.from("demandes_acces").delete().eq("discord_id", it.dataset.req).then(ok);
      toast("Demande refusée");
    } else if (b.dataset.act === "revoke") {
      const a = ACCESS.find(x => x.discord_id === it.dataset.acc);
      if (!confirmRevoke(a)) return;
      await sb.from("acces").delete().eq("discord_id", a.discord_id).then(ok);
      toast(`Accès retiré à ${a.pseudo}`);
    }
    await loadAccess(); render();
  } catch (err) { toast("Échec : " + err.message); }
  finally { b.disabled = false; }
});
let REVOKE = null;
function confirmRevoke(a) {  // deux clics pour retirer un accès
  if (REVOKE === a.discord_id) { REVOKE = null; return true; }
  REVOKE = a.discord_id; toast(`Clique encore pour retirer l'accès de ${a.pseudo}`);
  setTimeout(() => { if (REVOKE === a.discord_id) REVOKE = null; }, 4000);
  return false;
}
$("list").addEventListener("change", async e => {
  if (TAB !== "acc") return;
  const it = e.target.closest(".item[data-acc]"); if (!it || e.target.dataset.f !== "role") return;
  try {
    await sb.from("acces").update({ role: e.target.value }).eq("discord_id", it.dataset.acc).then(ok);
    await loadAccess(); render(); toast("Rôle modifié");
  } catch (err) { toast("Échec : " + err.message); }
});

// ---------------------------------------------------------------- chargement / enregistrement
async function reloadAll() {
  DB = await loadDb();
  LIVE = Object.fromEntries(DB.members.map(m => [norm(m.name), m]));
  ALIASES = Object.fromEntries(DB.all.filter(m => m.aliases.length).map(m => [norm(m.name), m.aliases]));
  if (DB.guild) { $("eyebrow").textContent = `${DB.guild} · Administration`; document.title = `Admin · ${DB.guild}`; }
  REMOVED = []; CONFIRM = null;
  ROWS = DB.all.map(m => { const r = { id: m.id, name: m.name, server: m.server, role: RANKS.includes(m.role) ? m.role : "Membre", main: m.main, on: m.on, aliases: m.aliases }; return { ...r, o: { ...r } }; });
  const count = {};
  ROWS.filter(r => r.on).forEach(r => { count[r.server] = (count[r.server] || 0) + 1; });
  DEFAULT_SERVER = Object.keys(count).sort((a, b) => count[b] - count[a])[0] || DEFAULT_SERVER;
  $("nServer").value = DEFAULT_SERVER;
  await Promise.all([loadEvals(), loadAccess()]);
  refreshAddRole();
  render();
  renderHealth();
}
function refreshAddRole() {
  const keep = $("nRole").value || "Membre";
  $("nRole").outerHTML = roleSelect({ role: "Membre", main: "" }, `id="nRole" aria-label="Statut ou alt de"`);
  if ([...$("nRole").options].some(o => o.value === keep)) $("nRole").value = keep;
}
const dbRow = r => ({ pseudo: r.name.trim(), serveur: (r.server || DEFAULT_SERVER).trim(), statut: r.role, main: (r.main || "").trim(), suivi: r.on });
$("save").addEventListener("click", async () => {
  ROWS = ROWS.filter(r => r.name.trim());
  const keys = ROWS.map(r => norm(r.name) + "|" + norm(r.server));
  const dup = keys.find((k, i) => keys.indexOf(k) !== i);
  if (dup) { $("barText").innerHTML = `<span style="color:var(--down)">${esc(dup.split("|")[0])} apparaît deux fois dans la liste.</span>`; return; }
  // Un main renommé : ses alts suivent
  ROWS.filter(r => !r.isNew && norm(r.name) !== norm(r.o.name)).forEach(r =>
    ROWS.filter(x => x.main && norm(x.main) === norm(r.o.name)).forEach(x => { x.main = r.name.trim(); }));
  const ch = changeList(), evCh = evalChanges();
  $("save").disabled = true; $("barText").textContent = "Enregistrement…";
  try {
    for (const r of REMOVED) await sb.from("membres").delete().eq("id", r.id).then(ok);
    for (const r of ROWS.filter(r => !r.isNew && isChanged(r))) {
      const row = dbRow(r);
      // Pseudo changé : l'ancien est gardé pour retrouver l'historique (import Excel…)
      if (norm(r.name) !== norm(r.o.name) && !r.aliases.some(a => norm(a) === norm(r.o.name))) row.anciens_noms = [...r.aliases, r.o.name];
      await sb.from("membres").update(row).eq("id", r.id).then(ok);
    }
    const added = ROWS.filter(r => r.isNew).map(dbRow);
    if (added.length) await sb.from("membres").insert(added).then(ok);
    if (evCh.length) await saveEvals();
    await reloadAll();
    if (ch.length) showRunMsg(true, "Enregistré. Un nouveau relevé des GS et CP est demandé : le classement sera à jour dans les 30 minutes environ.");
    toast("Enregistré");
  } catch (e) {
    const why = e.code === "23505" ? "Un de ces persos est déjà dans la liste (même pseudo et même serveur). Clique sur « Tout annuler » pour recharger."
      : e.code === "42501" ? "Ton compte n'a pas le droit de modifier la liste."
      : "Échec de l'enregistrement : " + e.message;
    $("barText").innerHTML = `<span style="color:var(--down)">${esc(why)}</span>`;
  } finally { $("save").disabled = false; }
});
function showRunMsg(good, text) {
  $("runMsg").hidden = false; $("runMsg").className = "msg " + (good ? "ok" : "err");
  $("runMsg").textContent = text;
}
$("rerun").addEventListener("click", async () => {
  $("rerun").disabled = true;
  try {
    await sb.from("demandes_maj").insert({ par: ME.nom || ME.discord_id, motif: "relancé depuis l'admin" }).then(ok);
    showRunMsg(true, "Relevé demandé : il sera lancé dans les 30 minutes environ (GitHub prend parfois un peu plus).");
    renderHealth();
  } catch (e) {
    showRunMsg(false, "Échec : " + e.message);
  } finally { setTimeout(() => $("rerun").disabled = false, 3000); }
});

// ---------------------------------------------------------------- connexion
$("logout").addEventListener("click", logout);
window.addEventListener("beforeunload", e => { if (ME && (changeList().length || evalChanges().length)) { e.preventDefault(); e.returnValue = ""; } });

auth(["admin", "gerant"]).then(async me => {
  ME = me;
  $("who").textContent = `${me.nom || "?"} · ${ROLE_LABEL[me.role]}`;
  $("tabAcc").hidden = me.role !== "admin";
  $("editor").hidden = false;
  await reloadAll();
}).catch(e => {
  $("editor").hidden = false;
  showRunMsg(false, "Chargement impossible : " + (e.message || e));
});
</script>
</body>
</html>
