name: Mise à jour CP guilde

on:
  schedule:
    # Toutes les 30 minutes, le script vérifie dans la base s'il y a quelque chose à faire :
    # un relevé demandé depuis l'admin (ou après l'ajout d'un perso), ou un dernier
    # relevé de plus de 11 h. Sinon il s'arrête en quelques secondes.
    # GitHub retarde souvent ces passages : compter jusqu'à une heure environ.
    - cron: "*/30 * * * *"
  workflow_dispatch:           # « Run workflow » : relevé complet immédiat

permissions:
  contents: write              # seulement pour le commit d'entretien ci-dessous

# Un seul passage à la fois ; les suivants attendent leur tour.
concurrency:
  group: update-db
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Récupérer les GS et CP
        env:
          # Clé secrète Supabase (Settings → Secrets and variables → Actions)
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python scripts/update.py ${{ github.event_name == 'schedule' && '--si-necessaire' || '' }}

      # GitHub coupe les passages planifiés d'un dépôt public sans commit depuis 60 jours.
      # Les données n'étant plus dans le dépôt, un petit commit d'entretien par mois l'évite.
      - name: Entretien du dépôt
        if: github.event_name == 'schedule'
        run: |
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -lt $(( 30 * 86400 )) ]; then exit 0; fi
          date -u +%Y-%m-%d > .github/entretien.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/entretien.txt
          git commit -q -m "Entretien : garde les relevés automatiques actifs"
          git push -q || echo "::warning::Commit d'entretien impossible."
