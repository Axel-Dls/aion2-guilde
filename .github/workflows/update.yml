name: Mise à jour CP guilde

on:
  schedule:
    - cron: "17 4 * * *"      # tous les jours vers 6h17 (heure de Paris en été)
  workflow_dispatch:           # bouton « Run workflow » dans l'onglet Actions
  push:
    branches: [main]
    paths: [members.csv, config.json, scripts/update.py]

permissions:
  contents: write

concurrency:
  group: update-db
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Récupérer les CP
        run: python scripts/update.py

      - name: Enregistrer les données
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/db.json
          if git diff --cached --quiet; then
            echo "Aucun changement."
          else
            git commit -m "Mise à jour des CP ($(date -u +%Y-%m-%d))"
            git pull --rebase
            git push
          fi
