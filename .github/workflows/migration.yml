name: Migration vers Supabase (une seule fois)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Installer le déchiffrement
        run: pip install --quiet "cryptography>=43,<51"

      - name: Copier les membres, l'historique et les évaluations dans Supabase
        env:
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python scripts/migrate.py
